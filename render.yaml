services:
  - type: web
    name: hireflow
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev --prefix backend && npm run build --prefix backend && npm ci --include=dev --prefix frontend && VITE_API_BASE_URL=/api/v1 npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SERVE_FRONTEND
        value: 'true'
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESUME_STORAGE_PROVIDER
        value: gridfs
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
