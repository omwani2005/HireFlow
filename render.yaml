services:
  - type: web
    name: hireflow-api
    runtime: node
    rootDir: backend
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: SERVE_FRONTEND
        value: 'false'
      - key: CLIENT_URL
        sync: false
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: '1'
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESUME_STORAGE_PROVIDER
        value: gridfs
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
